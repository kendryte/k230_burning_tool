name: Build and release

on:
  push:
    tags: ["v*"]
    branches: ["main", "dev", "feat/**"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: k230-burning-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve_pr:
    name: Approve pull request build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    # Configure this environment with required reviewers in repository settings.
    environment: pull-request-approval
    steps:
      - run: echo "Pull request build approved"

  build-linux:
    name: Linux x86_64
    needs: approve_pr
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.approve_pr.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get revision
        run: |
          revision=$(git describe --long --tags --always)
          echo "REVISION=$revision" >> "$GITHUB_ENV"
          echo "SAFE_REVISION=${revision//\//-}" >> "$GITHUB_ENV"

      - name: Build both variants
        run: |
          docker run --name qt6-linux \
            -v "${{ github.workspace }}:/home/user/project:ro" \
            stateoftheartio/qt6:6.6-gcc-aqt /bin/bash -euc '
              sudo apt-get update
              sudo apt-get install -y libgl-dev libvulkan-dev libssl-dev libudev-dev file
              sudo curl -fsSL \
                https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage \
                -o /usr/local/bin/linuxdeployqt
              sudo chmod +x /usr/local/bin/linuxdeployqt
              K230_BURNING_BUILD_DIR=/home/user/build \
                /home/user/project/release.sh
            '
          docker cp qt6-linux:/home/user/build "${{ github.workspace }}/build"
          docker rm qt6-linux

      - name: Collect artifacts
        run: |
          mkdir -p artifact_output
          cp build/*.tar.gz build/*.sha256 artifact_output/
          cp build/normal/K230BurningTool-*.AppImage \
            "artifact_output/K230BurningTool_linux_normal_${SAFE_REVISION}_x86_64.AppImage"
          cp build/avalon3/K230BurningTool-*.AppImage \
            "artifact_output/K230BurningTool_linux_avalon_${SAFE_REVISION}_x86_64.AppImage"
          (cd artifact_output && sha256sum *.AppImage > K230BurningTool_linux_AppImage.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-linux
          path: artifact_output/*
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Windows x86_64
    needs: approve_pr
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.approve_pr.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build both variants
        run: |
          docker run --name qt6-windows \
            -v "${{ github.workspace }}:/home/user/project:ro" \
            stateoftheartio/qt6:6.7-mingw-aqt /bin/bash -euc '
              sudo apt-get update
              sudo apt-get install -y zip
              CMAKE_BUILD_PARALLEL_LEVEL=4 \
              K230_BURNING_TARGET_OS=windows \
              K230_BURNING_BUILD_DIR=/home/user/build \
                /home/user/project/release.sh
            '
          docker cp qt6-windows:/home/user/build "${{ github.workspace }}/build"
          docker rm qt6-windows

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-windows
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error

  build-macos:
    name: macOS ARM64 (M4)
    needs: approve_pr
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.approve_pr.result == 'success') }}
    runs-on: [self-hosted, macOS, ARM64, shenzhen_mac]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja python@3.12

      - name: Prepare Python for Qt installer
        shell: bash
        run: |
          python_bin="$(brew --prefix python@3.12)/bin/python3.12"
          "$python_bin" -m venv "$RUNNER_TEMP/install-qt-python"
          echo "$RUNNER_TEMP/install-qt-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/install-qt-python/bin/python3" --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true
          setup-python: false

      - name: Build both variants as unsigned CI artifacts
        env:
          K230_BURNING_BUILD_DIR: ${{ github.workspace }}/build
          MACOS_ALLOW_UNSIGNED: "1"
          MACOS_ARCHITECTURES: arm64
        run: ./release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-macos-arm64
          path: |
            build/*.dmg
            build/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version info
        run: |
          tag_name="${GITHUB_REF##*/}"
          version_string="${tag_name#v}"
          if [[ "$version_string" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_value=$((BASH_REMATCH[1] * 1000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
          else
            echo "Tag must use vMAJOR.MINOR.PATCH: $tag_name" >&2
            exit 1
          fi
          hash_value=$(git rev-parse HEAD)
          printf '{"version": %d, "hash": "%s"}\n' "$version_value" "$hash_value" \
            > k230_burningtool_lastest.txt

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            k230_burningtool_lastest.txt
            release/**/*.AppImage
            release/**/*.tar.gz
            release/**/*.zip
            release/**/*.dmg
            release/**/*.sha256
