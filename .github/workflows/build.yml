name: Build and release

on:
  push:
    tags: ["v*"]
    branches: ["main", "dev"]

concurrency:
  group: k230-burning-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get revision
        run: |
          revision=$(git describe --long --tags --always)
          echo "REVISION=$revision" >> "$GITHUB_ENV"
          echo "SAFE_REVISION=${revision//\//-}" >> "$GITHUB_ENV"

      - name: Build both variants
        run: |
          docker run --name qt6-linux \
            -v "${{ github.workspace }}:/home/user/project:ro" \
            stateoftheartio/qt6:6.6-gcc-aqt /bin/bash -euc '
              sudo apt-get update
              sudo apt-get install -y libgl-dev libvulkan-dev libssl-dev libudev-dev file
              sudo curl -fsSL \
                https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage \
                -o /usr/local/bin/linuxdeployqt
              sudo chmod +x /usr/local/bin/linuxdeployqt
              K230_BURNING_BUILD_DIR=/home/user/build \
                /home/user/project/release.sh
            '
          docker cp qt6-linux:/home/user/build "${{ github.workspace }}/build"
          docker rm qt6-linux

      - name: Collect artifacts
        run: |
          mkdir -p artifact_output
          cp build/*.tar.gz build/*.sha256 artifact_output/
          cp build/normal/K230BurningTool-*.AppImage \
            "artifact_output/K230BurningTool_linux_normal_${SAFE_REVISION}_x86_64.AppImage"
          cp build/avalon3/K230BurningTool-*.AppImage \
            "artifact_output/K230BurningTool_linux_avalon_${SAFE_REVISION}_x86_64.AppImage"
          (cd artifact_output && sha256sum *.AppImage > K230BurningTool_linux_AppImage.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-linux
          path: artifact_output/*
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build both variants
        run: |
          docker run --name qt6-windows \
            -v "${{ github.workspace }}:/home/user/project:ro" \
            stateoftheartio/qt6:6.7-mingw-aqt /bin/bash -euc '
              sudo apt-get update
              sudo apt-get install -y zip
              CMAKE_BUILD_PARALLEL_LEVEL=4 \
              K230_BURNING_TARGET_OS=windows \
              K230_BURNING_BUILD_DIR=/home/user/build \
                /home/user/project/release.sh
            '
          docker cp qt6-windows:/home/user/build "${{ github.workspace }}/build"
          docker rm qt6-windows

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-windows
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error

  build-macos:
    name: macOS ARM64 validation/release
    runs-on: [self-hosted, macOS, ARM64, shenzhen_mac]
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'macos-signing' || 'macos-validation' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: brew install ninja python@3.12

      - name: Prepare Python for Qt installer
        shell: bash
        run: |
          python_bin="$(brew --prefix python@3.12)/bin/python3.12"
          "$python_bin" -m venv "$RUNNER_TEMP/install-qt-python"
          echo "$RUNNER_TEMP/install-qt-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/install-qt-python/bin/python3" --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true
          setup-python: false

      - name: Verify installed signing identity
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_KEYCHAIN: ${{ secrets.MACOS_KEYCHAIN }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGN_IDENTITY:?Set MACOS_SIGN_IDENTITY in the macos-signing environment}"
          : "${MACOS_KEYCHAIN_PASSWORD:?Set MACOS_KEYCHAIN_PASSWORD in the macos-signing environment}"
          MACOS_SIGN_IDENTITY="${MACOS_SIGN_IDENTITY//$'\r'/}"
          MACOS_SIGN_IDENTITY="${MACOS_SIGN_IDENTITY//$'\n'/}"
          MACOS_KEYCHAIN="${MACOS_KEYCHAIN//$'\r'/}"
          MACOS_KEYCHAIN="${MACOS_KEYCHAIN//$'\n'/}"
          if [[ -n "${MACOS_KEYCHAIN:-}" ]]; then
            signing_keychain="$MACOS_KEYCHAIN"
          else
            signing_keychain=$(security default-keychain -d user | sed \
              -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              -e 's/^"//' -e 's/"$//')
          fi
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain" >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain" >/dev/null
          identities=$(security find-identity -v -p codesigning "$signing_keychain" 2>/dev/null)
          if ! grep -F -- "$MACOS_SIGN_IDENTITY" <<<"$identities" >/dev/null; then
            echo "Installed signing identity was not found: $MACOS_SIGN_IDENTITY" >&2
            exit 1
          fi

      - name: Build and sign both variants
        env:
          K230_BURNING_BUILD_DIR: ${{ github.workspace }}/build
          MACOS_ARCHITECTURES: arm64
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_KEYCHAIN: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_KEYCHAIN || '' }}
          MACOS_KEYCHAIN_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_KEYCHAIN_PASSWORD || '' }}
          MACOS_NOTARY_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_NOTARY_PROFILE || '' }}
          MACOS_ALLOW_UNSIGNED: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
        run: ./release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: K230BurningTool-macos-arm64
          path: |
            build/*.dmg
            build/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate version info
        run: |
          tag_name="${GITHUB_REF##*/}"
          version_string="${tag_name#v}"
          if [[ "$version_string" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_value=$((BASH_REMATCH[1] * 1000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
          else
            echo "Tag must use vMAJOR.MINOR.PATCH: $tag_name" >&2
            exit 1
          fi
          hash_value=$(git rev-parse HEAD)
          printf '{"version": %d, "hash": "%s"}\n' "$version_value" "$hash_value" \
            > k230_burningtool_lastest.txt

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            k230_burningtool_lastest.txt
            release/**/*.AppImage
            release/**/*.tar.gz
            release/**/*.zip
            release/**/*.dmg
            release/**/*.sha256
